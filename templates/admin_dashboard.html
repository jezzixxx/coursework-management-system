<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">🏠 Главная</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Панель администратора</h1>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">📥 Импорт студентов</h5>
                        <p class="card-text">Загрузить CSV файл со списком студентов</p>
                        <a href="/import" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">📤 Экспорт паролей</h5>
                        <p class="card-text">Скачать файл с логинами и паролями</p>
                        <a href="/download-passwords" class="btn btn-success">Скачать</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">📁 Проекты</h5>
                        <p class="card-text">Управление курсовыми проектами</p>
                        <a href="/projects" class="btn btn-secondary">Перейти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
