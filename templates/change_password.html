<!DOCTYPE html>
<html lang="ru" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Смена пароля | Курсовые проекты</title>
  
  <!-- Шрифт Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bs-primary: #10b981;
      --bs-primary-rgb: 16, 185, 129;
      --bs-card-border-radius: 1rem;
      --bs-btn-border-radius: 0.65rem;
      --bs-body-font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    :root, [data-bs-theme="light"] {
      --bs-body-bg: #f8fafc;
      --bs-body-color: #0f172a;
      --bs-border-color: #e2e8f0;
      --bs-card-bg: #ffffff;
      --bs-secondary-color: #64748b;
    }

    @media (prefers-color-scheme: dark) {
      :root, [data-bs-theme="dark"] {
        --bs-body-bg: #0f172a;
        --bs-body-color: #e2e8f0;
        --bs-border-color: #334155;
        --bs-card-bg: #1e293b;
        --bs-secondary-color: #94a3b8;
      }
    }

    body { 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      letter-spacing: -0.01em;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
    }

    .card { background-color: var(--bs-card-bg); border-color: var(--bs-border-color); }

    .btn-primary { 
      --bs-btn-bg: var(--bs-primary); 
      --bs-btn-border-color: var(--bs-primary);
      --bs-btn-color: #fff;
    }
    .btn-primary:hover, .btn-primary:focus { 
      --bs-btn-bg: #059669; 
      --bs-btn-border-color: #059669;
    }

    .btn-outline-secondary {
      --bs-btn-color: var(--bs-body-color);
      --bs-btn-border-color: var(--bs-border-color);
    }
    .btn-outline-secondary:hover {
      --bs-btn-bg: var(--bs-body-color);
      --bs-btn-color: var(--bs-body-bg);
    }

    .icon {
      width: 1.25em; height: 1.25em; vertical-align: -0.2em;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }

    h1, h2, h3, h4, h5, h6, .navbar-brand { 
      letter-spacing: -0.03em; 
      color: var(--bs-body-color); 
    }

    .navbar {
      background-color: var(--bs-card-bg);
      border-bottom: 1px solid var(--bs-border-color);
    }
    .navbar-brand { color: var(--bs-body-color) !important; }

    .breadcrumb-item a { color: var(--bs-primary); text-decoration: none; }
    .breadcrumb-item a:hover { text-decoration: underline; }
    .breadcrumb-item.active { color: var(--bs-secondary-color); }
    .breadcrumb-item + .breadcrumb-item::before { color: var(--bs-secondary-color); }

    .form-control {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-color: var(--bs-border-color);
    }
    .form-control:focus {
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
    }

    .alert-danger { background-color: rgba(220, 53, 69, 0.12); border-color: rgba(220, 53, 69, 0.2); color: var(--bs-body-color); }
    .alert-success { background-color: rgba(var(--bs-primary-rgb), 0.12); border-color: rgba(var(--bs-primary-rgb), 0.2); color: var(--bs-body-color); }

    .warning-card {
      background-color: rgba(251, 146, 60, 0.12);
      border-left: 4px solid #f97316;
      color: var(--bs-body-color);
    }
    [data-bs-theme="dark"] .warning-card { background-color: rgba(251, 146, 60, 0.08); }

    /* Компактные поля пароля */
    .pw-input { max-width: 280px; width: 100%; }
  </style>
</head>
<body>

  <!-- Навигация -->
  <nav class="navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/dashboard">КУРСОВЫЕ</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small d-none d-sm-block fw-medium">
          <svg class="icon me-1" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          {{.user.FullName}} <span class="badge bg-secondary bg-opacity-25">{{.user.Role}}</span>
        </span>
        <a href="/logout" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          <svg class="icon me-1" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Выход
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    <!-- Хлебные крошки -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb bg-transparent p-0 mb-0 fw-medium">
        <li class="breadcrumb-item"><a href="/dashboard">Главная</a></li>
        <li class="breadcrumb-item active" aria-current="page">Смена пароля</li>
      </ol>
    </nav>

    <!-- Центральный блок -->
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        
        <!-- Предупреждение -->
        <div class="warning-card p-3 rounded-3 mb-3 d-flex align-items-start gap-2">
          <svg class="icon mt-1 flex-shrink-0" aria-hidden="true" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <h2 class="h6 fw-bold mb-1">Требуется смена пароля</h2>
            <p class="mb-0 small">Вы вошли с временным паролем. Установите постоянный для продолжения работы.</p>
          </div>
        </div>

        <!-- Алерты -->
        {{if .error}}
        <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 mb-3" role="alert">
          <svg class="icon flex-shrink-0" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{.error}}</span>
        </div>
        {{end}}

        {{if .success}}
        <div class="alert alert-success d-flex align-items-center gap-2 rounded-3 mb-3" role="alert">
          <svg class="icon flex-shrink-0" aria-hidden="true" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>{{.success}}</span>
        </div>
        {{end}}

        <!-- Форма -->
        <div class="card p-3 p-md-4">
          <form action="/change-password" method="POST" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="current_password" class="form-label fw-medium mb-1">Текущий пароль</label>
              <input type="password" class="form-control pw-input" id="current_password" name="current_password" required autocomplete="current-password">
            </div>
            
            <div class="mb-3">
              <label for="new_password" class="form-label fw-medium mb-1">Новый пароль</label>
              <input type="password" class="form-control pw-input" id="new_password" name="new_password" minlength="8" required autocomplete="new-password">
              <div class="form-text mt-1">Минимум 8 символов, рекомендуется буквы + цифры</div>
            </div>
            
            <div class="mb-3">
              <label for="confirm_password" class="form-label fw-medium mb-1">Подтвердите пароль</label>
              <input type="password" class="form-control pw-input" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
              <svg class="icon me-2" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              Сменить пароль
            </button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
