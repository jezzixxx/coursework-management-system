<!DOCTYPE html>
<html>
<head>
    <title>Смена пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="text-center">⚠️ Требуется смена пароля</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            Вы вошли с временным паролем. Пожалуйста, смените его на постоянный.
                        </div>
                        
                        {{if .error}}
                        <div class="alert alert-danger">{{.error}}</div>
                        {{end}}
                        {{if .success}}
                        <div class="alert alert-success">{{.success}}</div>
                        {{end}}
                        
                        <form action="/change-password" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Текущий пароль</label>
                                <input type="password" name="old_password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Новый пароль</label>
                                <input type="password" name="new_password" class="form-control" required>
                                <div class="form-text">Минимум 8 символов</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Подтвердите новый пароль</label>
                                <input type="password" name="confirm_password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Сменить пароль</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
