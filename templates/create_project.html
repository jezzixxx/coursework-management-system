<!DOCTYPE html>
<html>
<head>
    <title>Создать проект</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Создать новый проект</h1>
        
        {{if .error}}
        <div class="alert alert-danger">{{.error}}</div>
        {{end}}
        
        <form action="/projects/create" method="POST" class="card p-4">
            <div class="mb-3">
                <label class="form-label">Название проекта</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Исполнители (1-2 человека)</label>
                <select name="members" class="form-select" multiple size="5" required>
                    {{range .students}}
                    <option value="{{.ID}}">{{.FullName}} ({{.Group}})</option>
                    {{end}}
                </select>
                <div class="form-text">
                    Зажмите Ctrl для выбора нескольких (максимум 2 человека)
                </div>
                <div class="alert alert-warning mt-2">
                    ⚠️ Максимальное количество участников: 2 человека
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Создать</button>
            <a href="/projects" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
