<!DOCTYPE html>
<html>
<head>
    <title>Мои проекты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">🏠 Главная</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Мои проекты</h1>
        
        {{if .projects}}
        <div class="row">
            {{range .projects}}
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{.Title}}</h5>
                        <p class="card-text">{{.Description}}</p>
                        <span class="badge bg-info">{{.CurrentStatus}}</span>
                        <a href="/project/{{.ID}}" class="btn btn-primary mt-2">Открыть</a>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
        {{else}}
        <div class="alert alert-warning">У вас пока нет проектов</div>
        {{end}}
    </div>
</body>
</html>
