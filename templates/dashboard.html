<!DOCTYPE html>
<html>
<head>
    <title>Панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">🏠 Главная</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Добро пожаловать, {{.user.FullName}}!</h1>
        <p>Роль: {{.user.Role}}</p>
        
        {{if eq .user.Role "admin"}}
        <a href="/admin" class="btn btn-primary">Админ-панель</a>
        <a href="/admin/users" class="btn btn-warning">👥 Пользователи</a>
        {{end}}
        
        <a href="/change-password" class="btn btn-secondary">🔑 Сменить пароль</a>
        <a href="/my-projects" class="btn btn-success">Мои проекты</a>
    </div>
</body>
</html>
