<!DOCTYPE html>
<html>
<head>
    <title>Подтверждение администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Курсовые проекты</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">{{.user.FullName}}</span>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="text-center">⚠️ Подтверждение операции</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-warning">
                            Для выполнения этой операции требуется подтверждение пароля администратора.
                        </div>
                        
                        {{if .error}}
                        <div class="alert alert-danger">{{.error}}</div>
                        {{end}}
                        
                        <form action="/admin/confirm-password" method="POST">
                            <input type="hidden" name="next" value="{{.next}}">
                            <div class="mb-3">
                                <label class="form-label">Пароль администратора</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">Подтвердить</button>
                        </form>
                        <a href="/admin" class="btn btn-secondary w-100 mt-2">Отмена</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
