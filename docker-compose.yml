services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=course_db
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      - db
      - clamav
    volumes:
      - ./uploads:/root/uploads
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=course_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # === ClamAV антивирус (ОТДЕЛЬНЫЙ СЕРВИС) ===
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3310"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  clamav_data: